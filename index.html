<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Santurce Athletic Club</title>
<meta name="description" content="Santurce Athletic Club — Próximamente. San Juan, Puerto Rico.">
<meta name="theme-color" content="#06272e">
<link rel="icon" href="crest-full-color.png">
<link rel="apple-touch-icon" href="crest-full-color.png">
<link rel="stylesheet" href="styles.css">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--sac-navy);color:var(--text-inverse);font:var(--type-body);-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:var(--text-inverse);text-decoration:none}
a:hover{color:var(--sac-green)}
.stage{position:relative;height:100vh;height:100dvh;width:100%;display:grid;place-items:center;isolation:isolate;overflow:hidden}
/* Layer 1 — supplied brand field: dark teal halftone photograph */
.stage::before{content:"";position:absolute;inset:0;z-index:-4;background:#04161b url("landing-field.jpg") center/cover no-repeat;animation:fieldIn 1.8s var(--ease-out) both}
@keyframes fieldIn{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:scale(1)}}
/* Layer 2 — two slow drifting brand-hue auroras */
.glow{position:absolute;z-index:-3;border-radius:50%;filter:blur(120px);opacity:.4;mix-blend-mode:screen;will-change:transform}
.gw{position:absolute;inset:0;z-index:-3;pointer-events:none;transition:transform 1.2s var(--ease-standard);will-change:transform}
.gw.live{transition:none}
.gw.a{transform:translate3d(var(--ax,0px),var(--ay,0px),0)}
.gw.b{transform:translate3d(var(--bx,0px),var(--by,0px),0)}
.glow.a{width:60vw;height:60vw;left:-12vw;top:-18vw;background:radial-gradient(circle,var(--sac-blue) 0%,rgba(0,86,125,0) 68%);animation:driftA 26s ease-in-out infinite alternate}
.glow.b{width:52vw;height:52vw;right:-14vw;bottom:-20vw;background:radial-gradient(circle,var(--sac-green) 0%,rgba(0,168,23,0) 66%);opacity:.26;animation:driftB 31s ease-in-out infinite alternate}
@keyframes driftA{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(7vw,2vh,0) scale(1.08)}100%{transform:translate3d(3vw,7vh,0) scale(1.02)}}
@keyframes driftB{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-6vw,-3vh,0) scale(1.07)}100%{transform:translate3d(-2vw,-8vh,0) scale(1.01)}}
/* Layer 3 — vignette to seat the crest in the field */
.veil{position:absolute;inset:0;z-index:-1;background:radial-gradient(72% 62% at 50% 46%,transparent 34%,rgba(2,14,18,.66) 100%);animation:veilBreathe 19s var(--ease-standard) infinite alternate}
@keyframes veilBreathe{to{opacity:.88}}
/* Content */
.center{display:grid;justify-items:center;gap:clamp(28px,4vh,44px);text-align:center;padding:0 24px;perspective:900px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.crest-wrap{transform:translate3d(var(--tx,0px),var(--ty,0px),0) rotateX(calc(var(--ry,0deg) * -1)) rotateY(var(--rx,0deg));transform-style:preserve-3d;transition:transform .5s var(--ease-standard);will-change:transform}
.crest-wrap.live{transition:none}
.crest{width:clamp(200px,26vw,320px);height:auto;display:block;filter:drop-shadow(0 24px 60px rgba(0,0,0,.45));animation:rise 1.2s cubic-bezier(.16,1,.3,1) both,breathe 15s var(--ease-standard) 1.4s infinite}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.008)}}
.meta{display:grid;justify-items:center;gap:14px}
.rule{width:64px;height:1px;background:var(--line-inverse);animation:ruleIn 1.1s cubic-bezier(.16,1,.3,1) .5s both,ruleGlow 13s var(--ease-standard) 2s infinite}
@keyframes ruleGlow{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes ruleIn{from{width:0;opacity:0}to{width:64px;opacity:1}}
.wordmark{font:var(--weight-bold) clamp(15px,1.3vw,18px)/1.2 var(--font-display);letter-spacing:var(--track-widest);text-transform:uppercase;color:var(--sac-green);animation:rise 1.1s cubic-bezier(.16,1,.3,1) .68s both}
.tagline{font:var(--type-eyebrow);font-size:11px;letter-spacing:var(--track-wider);text-transform:uppercase;color:var(--sac-green);animation:rise 1.1s cubic-bezier(.16,1,.3,1) .84s both,fadePulse 8s var(--ease-standard) 2.2s infinite}
@keyframes fadePulse{0%,100%{opacity:1}50%{opacity:.62}}
/* Corner marks — fixed frame, per the brand's rule-and-margin layout */
.frame{position:absolute;inset:clamp(20px,3vw,40px);pointer-events:none;border:1px solid rgba(244,242,237,.09);animation:softIn 1.6s var(--ease-out) .1s both}
@keyframes softIn{from{opacity:0}to{opacity:1}}
.corner{position:absolute;top:calc(clamp(20px,3vw,40px) + 14px);font:var(--type-eyebrow);letter-spacing:var(--track-widest);text-transform:uppercase;color:rgba(0,168,23,.88);animation:rise 1.2s cubic-bezier(.16,1,.3,1) 1s both}.corner.l
{left:clamp(36px,4vw,58px)}
.corner.r{right:clamp(36px,4vw,58px)}
.foot{position:absolute;bottom:max(clamp(30px,3.4vw,48px),env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:clamp(20px,3vw,40px);font:var(--type-eyebrow);letter-spacing:var(--track-wider);text-transform:uppercase;color:var(--sac-green);animation:rise 1.2s cubic-bezier(.16,1,.3,1) 1.15s both}
.foot a{color:inherit;transition:color .2s ease;display:inline-flex;align-items:center;min-height:44px;padding:0 20px;margin:0 -20px}
.foot a:hover{color:var(--sac-paper)}
.foot a{text-underline-offset:5px;text-decoration:underline;text-decoration-thickness:1px;text-decoration-color:rgba(0,168,23,.45)}
@media (prefers-reduced-motion:reduce){.glow,.center,.crest,.rule,.wordmark,.tagline,.frame,.corner,.foot,.veil{animation:none}.stage::before{animation:none}.rule{width:64px}.crest-wrap{transform:none!important}}
@media (max-width:768px){
/* Portrait crops a 16:9 field hard — bias the crop toward the light in the upper left */
.stage::before{background:#04161b url("landing-field.jpg") 28% 34%/cover no-repeat}
.glow{filter:blur(64px);opacity:.3}
.glow.b{opacity:.19}
.glow.a{width:110vw;height:110vw;left:-30vw;top:-34vw}
.glow.b{width:100vw;height:100vw;right:-32vw;bottom:-30vw}
@keyframes driftA{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(7vw,3vh,0) scale(1.06)}100%{transform:translate3d(3vw,7vh,0) scale(1.02)}}
@keyframes driftB{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-6vw,-3vh,0) scale(1.05)}100%{transform:translate3d(-2vw,-7vh,0) scale(1.01)}}
.grid{background-size:56px 56px;mask-image:radial-gradient(90% 60% at 50% 48%,#000 15%,transparent 92%)}
@keyframes gridDrift{to{background-position:56px 56px}}
.veil{background:radial-gradient(85% 55% at 50% 46%,transparent 26%,rgba(4,25,30,.74) 100%)}
.frame{inset:16px}
.crest{width:min(62vw,300px)}
.crest-wrap{transition:transform .7s var(--ease-standard)}
.center{gap:clamp(22px,3.4vh,34px);padding:0 20px}
.corner{top:30px;font-size:9px;letter-spacing:.14em}
.corner.l{left:30px}
.corner.r{right:30px}
.wordmark{font-size:14px;letter-spacing:.17em;white-space:nowrap;line-height:1.2}
.tagline{font-size:10px}
}
@media (max-width:768px) and (orientation:landscape){.crest{width:min(30vw,190px)}.center{gap:16px}.corner{display:none}}
</style>
</head>
<body>
<main class="stage">
<div class="gw a"><div class="glow a"></div></div>
<div class="gw b"><div class="glow b"></div></div>
<div class="veil"></div>
<div class="frame"></div>
<span class="corner l">Est. Santurce</span>
<span class="corner r">Puerto Rico</span>
<div class="center">
<div class="crest-wrap"><img class="crest" src="crest-full-color.png" alt="Santurce Athletic Club"></div>
<div class="meta">
<span class="rule"></span>
<span class="wordmark">Nada Sobre’l Club</span>
<span class="tagline"></span>
</div>
</div>
<nav class="foot">
<a href="https://www.instagram.com/santurceac" target="_blank" rel="noopener">Instagram</a>
</nav>
</main>
<script>
(()=>{
const wrap=document.querySelector('.crest-wrap');
if(!wrap||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
const MAX_SHIFT=10,MAX_TILT=3.5;
let tx=0,ty=0,cx=0,cy=0,raf=0;
const tick=()=>{cx+=(tx-cx)*.05;cy+=(ty-cy)*.05;
wrap.style.setProperty('--tx',(cx*MAX_SHIFT).toFixed(2)+'px');
wrap.style.setProperty('--ty',(cy*MAX_SHIFT).toFixed(2)+'px');
wrap.style.setProperty('--rx',(cx*MAX_TILT).toFixed(2)+'deg');
wrap.style.setProperty('--ry',(cy*MAX_TILT).toFixed(2)+'deg');
raf=(Math.abs(tx-cx)>.0005||Math.abs(ty-cy)>.0005)?requestAnimationFrame(tick):0};
const set=(x,y)=>{tx=Math.max(-1,Math.min(1,x));ty=Math.max(-1,Math.min(1,y));wrap.classList.add('live');if(!raf)raf=requestAnimationFrame(tick)};
const rest=()=>{wrap.classList.remove('live');tx=ty=0;if(!raf)raf=requestAnimationFrame(tick)};
const pos=e=>set(e.clientX/innerWidth*2-1,e.clientY/innerHeight*2-1);
if(matchMedia('(hover:hover)').matches){
addEventListener('pointermove',pos,{passive:true});
addEventListener('pointerleave',rest);
}else{
let held=false;
addEventListener('pointerdown',e=>{held=true;pos(e)},{passive:true});
addEventListener('pointermove',e=>{if(held)pos(e)},{passive:true});
addEventListener('pointerup',()=>{held=false;rest()},{passive:true});
addEventListener('pointercancel',()=>{held=false;rest()},{passive:true});
}
})();
(()=>{
const A=document.querySelector('.gw.a'),B=document.querySelector('.gw.b');
if(!A||!B||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
if(matchMedia('(hover:hover)').matches)return;
const PULL_A=130,PULL_B=92;
let tx=0,ty=0,cx=0,cy=0,raf=0;
const tick=()=>{cx+=(tx-cx)*.03;cy+=(ty-cy)*.03;
A.style.setProperty('--ax',(cx*PULL_A).toFixed(1)+'px');
A.style.setProperty('--ay',(cy*PULL_A).toFixed(1)+'px');
B.style.setProperty('--bx',(cx*-PULL_B).toFixed(1)+'px');
B.style.setProperty('--by',(cy*-PULL_B).toFixed(1)+'px');
raf=(Math.abs(tx-cx)>.0004||Math.abs(ty-cy)>.0004)?requestAnimationFrame(tick):0};
const set=(x,y)=>{tx=Math.max(-1,Math.min(1,x));ty=Math.max(-1,Math.min(1,y));A.classList.add('live');B.classList.add('live');if(!raf)raf=requestAnimationFrame(tick)};
const release=()=>{A.classList.remove('live');B.classList.remove('live');tx=ty=0;if(!raf)raf=requestAnimationFrame(tick)};
const from=e=>set(e.clientX/innerWidth*2-1,e.clientY/innerHeight*2-1);
let down=false;
addEventListener('pointerdown',e=>{down=true;from(e)},{passive:true});
addEventListener('pointermove',e=>{if(down)from(e)},{passive:true});
addEventListener('pointerup',()=>{down=false;release()},{passive:true});
addEventListener('pointercancel',()=>{down=false;release()},{passive:true});
})();
</script>
</body>
</html>
